name: Blog.md CI/CD

on:
  pull_request:
  push:
    paths:
      - "src/**"
      - "index.html"
      - "publish.html"
      - "offline-plugin.ts"
      - "vite.config.ts"
      - "tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "worker/editor.production.jsonc"
      - ".github/workflows/deploy-editor.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    if: github.event_name == 'pull_request' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build and test with Chromium
        run: pnpm test:browser
      - name: Check Worker deployment bundles
        run: |
          pnpm exec wrangler deploy --dry-run --config worker/editor.production.jsonc
          pnpm exec wrangler deploy --dry-run --config worker/gateway.example.jsonc
          pnpm exec wrangler deploy --dry-run --config worker/posting-ui.example.jsonc
          pnpm exec wrangler deploy --dry-run --config worker/publisher.example.jsonc
      - name: Deploy shared Editor
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: pnpm exec wrangler deploy --config worker/editor.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
